[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "market-relationship-discovery"
version = "1.6.1"
description = "Demo-only quantitative research platform for market relationship discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "MetaTrader5>=5.0.45",
  "numpy>=2.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "pyarrow>=17.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
  "black>=24.10",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]

[project.scripts]
mrd = "market_relationship_discovery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_relationship_discovery"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires external services or MT5",
  "mt5: requires a configured MT5 terminal",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["market_relationship_discovery"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "MetaTrader5",
  "streamlit.*",
  "plotly",
  "plotly.*",
  "pandas",
  "pandas.*",
  "scipy",
  "scipy.*",
  "statsmodels.*",
]
ignore_missing_imports = true
